<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffbf0">
  <meta name="description" content="Nối Từ Siêu Tốc — Trò chơi nối từ tiếng Việt cực vui nhộn, rèn phản xạ ngôn ngữ và vốn từ vựng phong phú cùng Mind Phoenix!">
  <title>Nối Từ Siêu Tốc — Mind Phoenix Games</title>
  <link rel="canonical" href="https://mindphoenix.xyz/games/noi-tu/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mind Phoenix">
  <meta property="og:title" content="Nối Từ Siêu Tốc — Đấu Trí Nối Từ Tiếng Việt">
  <meta property="og:description" content="Mở rộng vốn từ ngữ và thử thách phản xạ nối từ siêu tốc vui nhộn!">
  <meta property="og:url" content="https://mindphoenix.xyz/games/noi-tu/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:image" content="https://mindphoenix.xyz/assets/og/mind-phoenix-social.png">
  <link rel="icon" type="image/png" href="../../assets/mascots/mind-phoenix-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
  <link rel="stylesheet" href="../language.css">
  <script type="module" src="game.js"></script>
  <script type="module" src="../../shared/analytics/analytics.mjs"></script>
  <script type="module" src="../../shared/chat/chat.mjs"></script>
</head>
<body>
  <svg class="icon-library" style="display: none;" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13-1a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3Zm13 0 5 6m0-6-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </svg>

  <div class="page-wrap">
    <header class="topbar">
      <a class="brand" href="../../" aria-label="Trang chủ Mind Phoenix">
        <img src="../../assets/mascots/mind-phoenix-logo.png" width="40" height="40" alt="Mind Phoenix Logo">
        <span>Mind Phoenix<small>TIẾNG VIỆT · NỐI TỪ SIÊU TỐC</small></span>
      </a>
      <div class="top-actions">
        <div class="lang-toggle" role="group" aria-label="Ngôn ngữ" hidden>
          <button type="button" data-lang="vi" aria-pressed="true">VI</button>
          <button type="button" data-lang="en" aria-pressed="false">EN</button>
        </div>
        <button class="round-button" id="sound-toggle" type="button" aria-pressed="true" aria-label="Tắt âm thanh" title="Tắt âm thanh">
          <svg class="icon" aria-hidden="true"><use href="#icon-sound"/></svg>
        </button>
        <a class="round-button" href="../" aria-label="Tất cả trò chơi" title="Tất cả trò chơi">
          <svg class="icon" aria-hidden="true"><use href="#icon-back"/></svg>
        </a>
      </div>
    </header>

    <main>
      <!-- HUD Dashboard -->
      <section class="hud-dashboard">
        <div class="hud-card">
          <span class="hud-label">Điểm số</span>
          <span class="hud-value" id="score-val">0</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">Độ dài xích</span>
          <span class="hud-value" id="chain-len-val">1</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">Chuỗi chuẩn</span>
          <span class="hud-value streak" id="streak-val">0</span>
        </div>
        <div class="hud-card">
          <span class="hud-label">Thời gian</span>
          <span class="hud-value time" id="time-val">15s</span>
        </div>
      </section>

      <!-- Target Syllable Spotlight -->
      <section class="spotlight-card">
        <div class="spotlight-title">Nối tiếp với tiếng:</div>
        <div class="spotlight-syllable" id="spotlight-syllable">HOA</div>
      </section>

      <!-- Current Chain View -->
      <section class="chain-history-box">
        <div class="hud-label" style="text-align: left;">Sợi xích từ ngữ đang nối:</div>
        <div class="chain-scroll" id="chain-scroll">
          <span class="chain-item active-current">HOA</span>
        </div>
      </section>

      <!-- Options Grid -->
      <section class="options-grid" id="options-grid">
        <!-- Rendered by game.js -->
      </section>
    </main>
  </div>

  <!-- Modal -->
  <div class="overlay-modal" id="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div style="font-size: 52px; margin-bottom: 8px;" id="modal-icon">🏆</div>
      <h2 style="font-size: 26px; color: var(--ink); margin-bottom: 8px;" id="modal-title">Kỷ Lục Mới!</h2>
      <p style="font-size: 15px; color: var(--muted); margin-bottom: 16px;" id="modal-desc">Bạn đã nối được chuỗi xích từ cực kỳ ấn tượng!</p>
      <div style="font: 800 24px 'Baloo 2'; color: var(--amber-dark); margin-bottom: 24px;" id="modal-score">1200 Điểm</div>
      <button class="modal-btn" id="modal-btn" type="button">Chơi Lại</button>
    </div>
  </div>
</body>
</html>
